name: Build Windows Installer v2

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      CHROME_EXTENSION_ID: oknnfcnknnalckkpgjnbflmoiofhnffp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        shell: powershell
        run: |
          py -3 -m pip install --upgrade pip pyinstaller

      - name: Build native host executable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build-native-host.ps1

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Read extension version
        id: extension_version
        shell: powershell
        run: |
          $manifest = Get-Content extensions\subject-folder-downloader\manifest.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DChromeExtensionId=$env:CHROME_EXTENSION_ID" `
            "/DAppVersion=${{ steps.extension_version.outputs.version }}" `
            installer\subject-folder-downloader-v2.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: subject-folder-downloader-setup
          path: installer\Output\subject-folder-downloader-setup.exe

      - name: Package native host executable bundle
        shell: powershell
        run: |
          Compress-Archive -Path `
            native-host\dist\subject-folder-downloader-host.exe, `
            native-host\README.md, `
            native-host\install-native-host.ps1, `
            native-host\disable-native-host.ps1, `
            native-host\enable-native-host.ps1 `
            -DestinationPath subject-folder-downloader-native-host.zip

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer\Output\subject-folder-downloader-setup.exe
            subject-folder-downloader-native-host.zip
