name: Build Windows Installer v2

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Validate extension id input
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHROME_EXTENSION_ID)) {
            throw "CHROME_EXTENSION_ID is required to build the installer."
          }

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DChromeExtensionId=$env:CHROME_EXTENSION_ID" installer\subject-folder-downloader-v2.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: subject-folder-downloader-setup
          path: installer\Output\subject-folder-downloader-setup.exe
