name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\subject-folder-downloader.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: subject-folder-downloader-setup
          path: installer\Output\subject-folder-downloader-setup.exe
