<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subject Folder Downloader</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f7f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 340px;
        margin: 0;
        padding: 18px;
        background: #f7f8fb;
      }

      main {
        display: grid;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: #526070;
        font-size: 13px;
        line-height: 1.45;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        width: 100%;
        border: 1px solid #ccd3df;
        border-radius: 6px;
        padding: 10px 11px;
        font: inherit;
        color: #172033;
        background: #ffffff;
        outline: none;
      }

      input:focus {
        border-color: #2764d8;
        box-shadow: 0 0 0 3px rgba(39, 100, 216, 0.14);
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        font: inherit;
        font-weight: 700;
        color: #ffffff;
        background: #2764d8;
        cursor: pointer;
      }

      button:hover {
        background: #1f55b8;
      }

      #status {
        min-height: 20px;
        font-size: 13px;
        color: #1f7a42;
      }

      #status.error {
        color: #c43030;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>과목 다운로드 폴더</h1>
      <p>과목 페이지 URL을 과목명과 연결하면, 이후 다운로드가 Downloads 안의 과목 폴더로 저장됩니다.</p>

      <label for="subjectName">
        과목명
        <input id="subjectName" type="text" autocomplete="off" placeholder="예: 자료구조">
      </label>

      <label for="subjectUrl">
        과목 URL
        <input id="subjectUrl" type="url" autocomplete="off" placeholder="비워두면 현재 탭 URL 사용">
      </label>

      <button id="saveButton" type="button">저장</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
